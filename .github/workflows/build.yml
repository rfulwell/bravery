# Builds and publishes Bravery on your build machine, registered as a
# self-hosted runner with the label "bravery". Queued by "Watch for Brave
# releases" (which runs on GitHub's free runners), or by hand from the Actions
# tab. If the machine is off, the job waits in the queue for up to 24 hours;
# the watcher queues it again after that. The machine needs
# ~/.bravery/bravery.conf and the signing key.
name: Build Bravery

on:
  workflow_dispatch:
    inputs:
      brave_tag:
        description: 'Brave tag to build (default: latest stable)'
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: bravery-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, linux, bravery]
    timeout-minutes: 1440
    env:
      GH_TOKEN: ${{ github.token }}
      BRAVERY_UPDATED: '1'
      BRAVERY_BRAVE_TAG: ${{ inputs.brave_tag }}
    steps:
      - uses: actions/checkout@v4
      - run: scripts/auto-update.sh
