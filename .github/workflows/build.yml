# Optional: run the automatic build from GitHub Actions on your own build
# machine, registered as a self-hosted runner with the label "bravery".
# (The simpler alternative is a cron job or systemd timer on the machine; see
# README.) Either way the machine needs ~/.bravery/bravery.conf and the keystore.
name: Build Bravery

on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:
    inputs:
      brave_tag:
        description: 'Brave tag to build (default: latest stable)'
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: bravery-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, linux, bravery]
    timeout-minutes: 1440
    env:
      GH_TOKEN: ${{ github.token }}
      BRAVERY_UPDATED: '1'
      BRAVERY_BRAVE_TAG: ${{ inputs.brave_tag }}
    steps:
      - uses: actions/checkout@v4
      - run: scripts/auto-update.sh
